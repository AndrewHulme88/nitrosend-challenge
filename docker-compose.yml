services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nitrosend_challenge_development
    ports: 
      - "5433:5432"
    volumes: 
      - postgres_data:/var/lib/postgresql/postgres_data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/redis_data

volumes:
  postgres_data:
  redis_data: