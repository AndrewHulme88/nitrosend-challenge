version: 2
updates:
- package-ecosystem: bundler
  directory: "/api"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
- package-ecosystem: npm
  directory: "/frontend"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  ignore:
    - dependency-name: typescript
      update-types: [ "version-update:semver-major" ]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
